name: Web checks and deployment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['dronemissions/**', 'deploy/**', '.github/workflows/web-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dronemissions-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PHP extensions
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-sqlite3 php-xml php-zip php-gd
      - name: Syntax, deployment tests and release package
        run: |
          find dronemissions/public deploy -name '*.php' -print0 | xargs -0 -n1 php -l
          find dronemissions/public -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m unittest discover -s deploy/tests -v
          python3 deploy/package.py dronemissions/public release.zip "$GITHUB_SHA"
      - name: Archive and preview integration tests (synthetic loopback installation)
        run: |
          test_private=$(mktemp -d /tmp/dm-preview-XXXXXX)
          php dronemissions/tests/setup-preview-test.php "$test_private"
          test_web=$(mktemp -d /tmp/dm-preview-web-XXXXXX)
          ln -s "$PWD/dronemissions/public" "$test_web/dronemissions"
          env DRONEMISSIONS_PRIVATE="$test_private" php -S 127.0.0.1:18764 -t "$test_web" > "$test_private/server.log" 2>&1 &
          test_pid=$!
          trap 'kill "$test_pid"; rm -rf "$test_private" "$test_web"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:18764/dronemissions/api.php?action=session' >/dev/null && break
            sleep 0.2
          done
          python3 dronemissions/tests/integration.py --base http://127.0.0.1:18764/dronemissions/ --access "$test_private/access.json" --allow-test-writes
          python3 dronemissions/tests/previews.py --base http://127.0.0.1:18764/dronemissions/ --access "$test_private/access.json"
          python3 dronemissions/tests/project-maps-pois.py --base http://127.0.0.1:18764/dronemissions/ --access "$test_private/access.json"
          python3 dronemissions/tests/planner-api.py --base http://127.0.0.1:18764/dronemissions/ --access "$test_private/access.json"
      - name: Release switching and rollback tests
        run: php deploy/tests/receiver.php
      - name: Parser regression tests
        run: |
          php dronemissions/tests/parser.php
          php dronemissions/tests/planner.php
          node dronemissions/tests/planner-live.cjs
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://service.studiobaff.com/dronemissions/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build public release
        run: python3 deploy/package.py dronemissions/public release.zip "$GITHUB_SHA"
      - name: Configure restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.DRONEMISSIONS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DRONEMISSIONS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Publish release and verify HTTPS
        run: |
          checksum=$(sha256sum release.zip | cut -d ' ' -f1)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 studiobaff@service.studiobaff.com "deploy $GITHUB_SHA $checksum" < release.zip
          python3 deploy/health.py "https://service.studiobaff.com/dronemissions/" "$GITHUB_SHA"
      - name: Clean SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
